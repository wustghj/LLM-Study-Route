name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        phase:
          - phase1-api
          - phase2-transformer
          - phase4-apps/rag
          - phase4-apps/agent
          - phase5-customize/finetune
          - phase6-production
          - phase7-source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check ${{ matrix.phase }}
        run: |
          find ${{ matrix.phase }} -name "*.py" -exec python -m py_compile {} +

  smoke-test:
    runs-on: ubuntu-latest
    needs: compile-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Phase 2 smoke test
        working-directory: phase2-transformer
        run: |
          pip install numpy
          python transformer.py

      - name: Phase 6 production smoke tests
        working-directory: phase6-production
        run: |
          python -m py_compile logger.py
          python -m py_compile cost.py
          python cost.py
