# 使用前请复制此文件为 config.toml 并编辑
# 推荐使用环境变量设置 API Key，避免将 Key 提交到 git

# DeepSeek
api_key = "$DEEPSEEK_API_KEY"          # 设置环境变量: $env:DEEPSEEK_API_KEY="sk-..."
base_url = "https://api.deepseek.com"
model = "deepseek-chat"

